<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>이미지 영역 하이라이트</title>
    <script>
        (function () {
            var theme = 'light';
            try { if (localStorage.getItem('theme') === 'dark') theme = 'dark'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="app" id="app" data-sidebar="left">
        <aside class="panel sidebar" id="sidebar" data-collapsed="false">
            <div class="sidebar-bar">
                <div class="sidebar-side">
                    <span id="sidebarSideLabel">위치</span>
                    <div class="seg" role="group" aria-labelledby="sidebarSideLabel">
                        <button type="button" id="sideLeftBtn" data-side="left" aria-pressed="true">좌측</button>
                        <button type="button" id="sideRightBtn" data-side="right" aria-pressed="false">우측</button>
                    </div>
                </div>
                <div class="sidebar-tools">
                    <button type="button" class="icon-btn" id="themeBtn" aria-label="라이트 모드로 전환" title="라이트 모드로 전환">
                        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    </button>
                    <button type="button" class="icon-btn" id="sidebarCollapseBtn" aria-controls="sidebarBody"
                            aria-expanded="true" aria-label="사이드바 접기" title="사이드바 접기" data-dir="left">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5l-7 7 7 7"/></svg>
                    </button>
                </div>
            </div>

            <div class="sidebar-body" id="sidebarBody">
                <section class="acc">
                    <button type="button" class="acc-head" id="accWorkHead" aria-expanded="true" aria-controls="accWorkBody">
                        <span>작업 패널</span>
                    </button>
                    <div class="acc-body controls" id="accWorkBody">
                        <div class="section">
                            <h2><span class="step">1</span>이미지 불러오기</h2>
                            <label class="file-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                                파일 선택
                                <input type="file" id="fileInput" accept="image/*" style="display:none">
                            </label>
                        </div>

                        <div class="section">
                            <h2><span class="step">2</span>테두리 스타일</h2>
                            <div class="field field-inline">
                                <label for="colorInput">색상</label>
                                <div class="color-picker">
                                    <span class="color-swatch">
                                        <input type="color" id="colorInput" value="#ff0000">
                                    </span>
                                    <span class="color-hex" id="colorHex">#FF0000</span>
                                </div>
                            </div>
                            <div class="field field-inline">
                                <label for="labelToggle">번호 라벨</label>
                                <span class="switch">
                                    <input type="checkbox" id="labelToggle">
                                    <span class="switch-track"></span>
                                </span>
                            </div>
                            <div class="field">
                                <label for="widthInput"><span>선 두께</span><span><span id="widthLabel">3</span>px</span></label>
                                <input type="range" id="widthInput" min="1" max="20" value="3">
                            </div>
                            <div class="field">
                                <label for="dimInput"><span>외부 어둡게(Dim)</span><span><span id="dimLabel">35</span>%</span></label>
                                <input type="range" id="dimInput" min="0" max="90" value="35">
                            </div>
                        </div>

                        <div class="section">
                            <h2><span class="step">3</span>영역 목록</h2>
                            <ul id="boxList"></ul>
                            <div class="empty-note" id="emptyNote">아직 그려진 영역이 없습니다.</div>
                        </div>

                        <div class="section">
                            <div class="row">
                                <button id="undoBtn" disabled>실행 취소</button>
                                <button id="clearBtn" disabled>전체 삭제</button>
                            </div>
                            <button id="resetImgBtn" disabled style="margin-top:8px; width:100%;">다른 이미지 불러오기</button>
                            <button id="downloadBtn" class="primary" disabled style="margin-top:8px; width:100%;">이미지 다운로드</button>
                        </div>
                    </div>
                </section>

                <section class="acc">
                    <button type="button" class="acc-head" id="accShortcutHead" aria-expanded="true" aria-controls="accShortcutBody">
                        <span>단축키 가이드</span>
                    </button>
                    <div class="acc-body" id="accShortcutBody">
                        <ul class="shortcut-list">
                            <li><span>영역 그리기</span><span class="kbd-group">드래그</span></li>
                            <li><span>테두리 자동 감지</span><span class="kbd-group">클릭</span></li>
                            <li><span>이미지 붙여넣기</span><span class="kbd-group"><kbd>Ctrl</kbd>+<kbd>V</kbd></span></li>
                            <li><span>실행 취소</span><span class="kbd-group"><kbd>Ctrl</kbd>+<kbd>Z</kbd></span></li>
                            <li><span>다시 실행</span><span class="kbd-group"><kbd>Ctrl</kbd>+<kbd>Y</kbd></span></li>
                        </ul>
                    </div>
                </section>
            </div>
        </aside>

        <main class="stage">
            <div class="canvas-stack">
                <div class="field">
                    <label for="filenameInput">파일명</label>
                    <input type="text" id="filenameInput" placeholder="image">
                </div>
                <div id="dropzone">
                    <div id="placeholder">
                        <div class="placeholder-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        </div>
                        이미지를 여기에 드래그하거나<br>
                        사이드바에서 파일을 선택하거나<br>
                        <b>Ctrl+V</b>로 붙여넣으세요.
                    </div>
                    <canvas id="canvas"></canvas>
                    <div id="notice" role="status" aria-live="polite"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="autodetect.js"></script>
    <script src="app.js"></script>
</body>
</html>
